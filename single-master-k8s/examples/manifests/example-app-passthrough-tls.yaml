# Example application with PASSTHROUGH TLS
# TLS terminates at the Pod (application handles TLS)
# Traffic from Ingress to Pod remains encrypted (HTTPS)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-passthrough-tls-config
  namespace: default
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        server {
            listen 443 ssl;
            server_name passthrough.example.com;

            ssl_certificate /etc/nginx/ssl/tls.crt;
            ssl_certificate_key /etc/nginx/ssl/tls.key;

            location / {
                return 200 'HTTPS is working! This is passthrough TLS.\n';
                add_header Content-Type text/plain;
            }
        }
    }
---
