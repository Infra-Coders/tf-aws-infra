apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-passthrough-tls
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-passthrough-tls
  template:
    metadata:
      labels:
        app: nginx-passthrough-tls
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls-cert
              mountPath: /etc/nginx/ssl
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-passthrough-tls-config
        - name: tls-cert
          secret:
            secretName: nginx-passthrough-tls-cert
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-passthrough-tls
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: nginx-passthrough-tls
  ports:
    - port: 443
      targetPort: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-passthrough-tls
  namespace: default
  annotations:
    # SSL passthrough - traffic goes encrypted to the backend
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    external-dns.alpha.kubernetes.io/hostname: "passthrough.luke.infra-coders.com" # Auto-create DNS record
spec:
  ingressClassName: nginx
  rules:
    - host: passthrough.luke.infra-coders.com # CHANGE THIS to your domain!
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-passthrough-tls
                port:
                  number: 443
